UI vesamenu.c32
TIMEOUT 300
MENU TITLE KnucklsOS
DEFAULT live

LABEL live
MENU LABEL KnucklsOS Live (Standard - real hardware)
KERNEL /live/vmlinuz
APPEND initrd=/live/initrd.img boot=live components username=knucklsos

LABEL live-safe
MENU LABEL KnucklsOS Live (Safe Graphics / VM - nomodeset)
KERNEL /live/vmlinuz
APPEND initrd=/live/initrd.img boot=live components nomodeset username=knucklsos

LABEL live-debug
MENU LABEL KnucklsOS Live (Debug / verbose)
KERNEL /live/vmlinuz
APPEND initrd=/live/initrd.img boot=live components nomodeset plymouth.enable=0 username=knucklsos
