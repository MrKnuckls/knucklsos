name: Build KnucklsOS ISO

on:
  push:
    branches: [main, ubuntu]
    paths-ignore:
      - '*.md'
      - 'README'
      - 'previews/**'
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest runs as root -> live-build works here.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real Debian live-build (not the broken Ubuntu fork)
        run: |
          set -x
          sudo apt-get update 2>&1 | tee -a install.log
          sudo apt-get install -y debootstrap cpio squashfs-tools xorriso \
            apt-utils isolinux syslinux wget ca-certificates 2>&1 | tee -a install.log
          # Pull the native Debian live-build from bookworm (Ubuntu's fork is
          # broken for our use). Also need the Debian archive keyring.
          echo 'deb [trusted=yes] http://deb.debian.org/debian bookworm main' | \
            sudo tee /etc/apt/sources.list.d/debian-bookworm.list
          sudo apt-get update 2>&1 | tee -a install.log
          sudo apt-get install -y -t bookworm live-build debian-archive-keyring 2>&1 | tee -a install.log
          echo "=== live-build version ==="
          lb --version | tee -a install.log
          # Fork bug: kernel Contents path moved to dists/<s>/main/Contents.
          # Patch the installed script (uses ${LB_DISTRIBUTION}, not ${DIST}).
          sudo find / -name 'lb_chroot_linux_image' 2>/dev/null | while read -r f; do
            sudo sed -i \
              -e 's#dists/${LB_DISTRIBUTION}/Contents-#dists/${LB_DISTRIBUTION}/main/Contents-#g' \
              "$f"
          done
          # Ensure isolinux bits ship in the bootloaders dir (defensive copy).
          set +e
          mkdir -p config/bootloaders/isolinux
          for f in isolinux.bin vesamenu.c32 ldlinux.c32 libcom32.c32 libutil.c32; do
            for d in /usr/lib/ISOLINUX /usr/lib/syslinux/modules/bios /usr/share/syslinux /usr/lib/syslinux; do
              if [ -f "$d/$f" ]; then
                cp -f "$d/$f" config/bootloaders/isolinux/ 2>/dev/null
                break
              fi
            done
          done
          if [ -d /usr/lib/syslinux/modules/bios ]; then
            cp -rf /usr/lib/syslinux/modules/bios/. config/bootloaders/isolinux/ 2>/dev/null && \
              echo "copied extra syslinux modules" || echo "WARNING: could not copy (non-fatal)"
          fi
          mkdir -p config/bootloaders/grub
          echo "=== config/bootloaders/isolinux contents ==="
          ls -l config/bootloaders/isolinux/ 2>&1 | tee -a install.log

      - name: Build ISO
        run: sudo ./build.sh

      - name: Upload install log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-install-log
          path: install.log
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-build-log
          path: build.log
          retention-days: 7

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-iso
          path: "*.iso"
          retention-days: 30
