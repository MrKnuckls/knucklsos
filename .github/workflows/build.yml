name: Build KnucklsOS ISO

# Builds a bootable KnucklsOS ISO on GitHub's runners (which run as root).
# Triggers automatically on every push to main, and can be run manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Build ISO
        run: |
          sudo ./build.sh
          echo "=== build.sh exit: $? ==="
          ls -lh *.iso 2>/dev/null || echo "NO ISO PRODUCED"

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-iso
          path: "*.iso"
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-build-log
          path: |
            build.log
            *.buildlog
            chroot/*
          retention-days: 7
