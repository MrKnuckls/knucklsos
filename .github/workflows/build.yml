name: Build KnucklsOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          set -x
          sudo apt-get update 2>&1 | tee -a install.log
          sudo apt-get install -y live-build debootstrap cpio squashfs-tools xorriso apt-utils 2>&1 | tee -a install.log

      - name: Build ISO
        run: sudo ./build.sh

      - name: Upload install log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-install-log
          path: install.log
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-build-log
          path: build.log
          retention-days: 7

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-iso
          path: "*.iso"
          retention-days: 30
