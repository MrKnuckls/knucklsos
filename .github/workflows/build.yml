name: Build KnucklsOS ISO

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'README'
      - 'previews/**'
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest is always available; we install the REAL Debian live-build
    # from Debian's bookworm repo (not Ubuntu's fork, which hardcodes ubuntu-
    # mode gfxboot behavior and breaks Debian builds).
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real Debian live-build
        run: |
          set -x
          sudo apt-get update 2>&1 | tee -a install.log
          # Build tooling available on the Ubuntu runner.
          sudo apt-get install -y debootstrap cpio squashfs-tools xorriso apt-utils isolinux syslinux wget ca-certificates 2>&1 | tee -a install.log
          # Add Debian bookworm as a source so we can pull the native
          # live-build package (Ubuntu's fork is too old/broken for Debian).
          echo 'deb [trusted=yes] http://deb.debian.org/debian bookworm main' | sudo tee /etc/apt/sources.list.d/debian-bookworm.list
          sudo apt-get update 2>&1 | tee -a install.log
          # Prefer the Debian live-build over any Ubuntu one. Also need the
          # Debian archive keyring so debootstrap can verify the Bookworm repo.
          sudo apt-get install -y -t bookworm live-build debian-archive-keyring 2>&1 | tee -a install.log
          echo "=== live-build version ==="
          lb --version | tee -a install.log
          # Ensure the isolinux bootloader files ship with the bootloaders dir.
          # Native Debian live-build provides these, but copy them in defensively.
          set +e
          mkdir -p config/bootloaders/isolinux
          for f in isolinux.bin vesamenu.c32 ldlinux.c32 libcom32.c32 libutil.c32; do
            for d in /usr/lib/ISOLINUX /usr/lib/syslinux/modules/bios /usr/share/syslinux /usr/lib/syslinux; do
              if [ -f "$d/$f" ]; then
                cp -f "$d/$f" config/bootloaders/isolinux/ 2>/dev/null
                break
              fi
            done
          done
          if [ -d /usr/lib/syslinux/modules/bios ]; then
            cp -rf /usr/lib/syslinux/modules/bios/. config/bootloaders/isolinux/ && \
              echo "copied extra syslinux modules" || \
              echo "WARNING: could not copy syslinux modules (non-fatal)"
          else
            echo "NOTE: /usr/lib/syslinux/modules/bios not present; relying on loop above."
          fi
          mkdir -p config/bootloaders/grub
          echo "=== config/bootloaders/isolinux contents ==="
          ls -l config/bootloaders/isolinux/ 2>&1 | tee -a install.log

      - name: Build ISO
        run: sudo ./build.sh

      - name: Upload install log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-install-log
          path: install.log
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-build-log
          path: build.log
          retention-days: 7

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-iso
          path: "*.iso"
          retention-days: 30
