name: Build KnucklsOS ISO

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'README'
      - 'previews/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          set -x
          sudo apt-get update 2>&1 | tee -a install.log
          sudo apt-get install -y live-build debootstrap cpio squashfs-tools xorriso apt-utils isolinux syslinux 2>&1 | tee -a install.log
          # WORKAROUND: Ubuntu's live-build fork (3.0~a57) fetches the kernel
          # version list from dists/<suite>/Contents-amd64.gz, but Debian moved
          # that file to dists/<suite>/main/Contents-amd64.gz (404 -> build fails).
          # Patch the correct variable patterns in the installed script(s).
          echo "=== locating lb_chroot_linux-image ==="
          sudo find / -name 'lb_chroot_linux-image' 2>/dev/null | sudo tee -a install.log
          sudo find / -name 'lb_chroot_linux-image' | while read -r f; do
            sudo sed -i \
              -e 's#dists/${LB_PARENT_DISTRIBUTION}/Contents-#dists/${LB_PARENT_DISTRIBUTION}/main/Contents-#g' \
              -e 's#dists/${LB_DISTRIBUTION}/Contents-#dists/${LB_DISTRIBUTION}/main/Contents-#g' \
              "$f"
            echo "patched $f"
          done
          echo "=== verify patch ==="
          sudo find / -name 'lb_chroot_linux-image' -exec grep -n 'Contents' {} \; 2>/dev/null | sudo tee -a install.log
          # WORKAROUND 2: some live-build script copies isolinux boot files
          # from /root/isolinux/ (empty on the runner). Find exactly which
          # script/line references it. Diagnose first, then patch.
          echo "=== grep isolinux.bin across all live-build scripts ==="
          sudo grep -rn 'isolinux.bin\|/root/isolinux\|SYSLINUX_PATH' /usr/lib/live /usr/share/live 2>/dev/null | sudo tee -a install.log
          # Best-effort patch: replace any hardcoded /root/isolinux in scripts.
          sudo grep -rl '/root/isolinux' /usr/lib/live /usr/share/live 2>/dev/null | while read -r f; do
            sudo sed -i 's#/root/isolinux#/usr/lib/ISOLINUX#g' "$f"; echo "patched $f"
          done
          [ -f /usr/lib/ISOLINUX/vesamenu.c32 ] || \
            sudo cp -af /usr/lib/syslinux/modules/bios/vesamenu.c32 /usr/lib/ISOLINUX/ 2>/dev/null
          echo "=== syslinux source check ==="
          ls -l /usr/lib/ISOLINUX/isolinux.bin /usr/lib/ISOLINUX/vesamenu.c32 2>&1 | sudo tee -a install.log

      - name: Build ISO
        run: sudo ./build.sh

      - name: Upload install log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-install-log
          path: install.log
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-build-log
          path: build.log
          retention-days: 7

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-iso
          path: "*.iso"
          retention-days: 30
