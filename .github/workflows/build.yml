name: Build KnucklsOS ISO

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'README'
      - 'previews/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          set -x
          sudo apt-get update 2>&1 | tee -a install.log
          sudo apt-get install -y live-build debootstrap cpio squashfs-tools xorriso apt-utils isolinux syslinux 2>&1 | tee -a install.log
          # WORKAROUND: Ubuntu's live-build fork (3.0~a57) fetches the kernel
          # version list from dists/<suite>/Contents-amd64.gz, but Debian moved
          # that file to dists/<suite>/main/Contents-amd64.gz (404 -> build fails).
          # Patch the correct variable patterns in the installed script(s).
          echo "=== locating lb_chroot_linux-image ==="
          sudo find / -name 'lb_chroot_linux-image' 2>/dev/null | sudo tee -a install.log
          sudo find / -name 'lb_chroot_linux-image' | while read -r f; do
            sudo sed -i \
              -e 's#dists/${LB_PARENT_DISTRIBUTION}/Contents-#dists/${LB_PARENT_DISTRIBUTION}/main/Contents-#g' \
              -e 's#dists/${LB_DISTRIBUTION}/Contents-#dists/${LB_DISTRIBUTION}/main/Contents-#g' \
              "$f"
            echo "patched $f"
          done
          echo "=== verify patch ==="
          sudo find / -name 'lb_chroot_linux-image' -exec grep -n 'Contents' {} \; 2>/dev/null | sudo tee -a install.log
          # WORKAROUND 2 (root cause): live-build's lb_binary_syslinux copies
          # boot files from /usr/share/live/build/bootloaders/isolinux, but on
          # the Ubuntu fork that dir lacks isolinux.bin / vesamenu.c32 (they
          # ship in /usr/lib/ISOLINUX and /usr/lib/syslinux/modules/bios).
          # Populate the bootloaders dir with the real syslinux binaries so the
          # copy into chroot/root/isolinux is complete.
          sudo mkdir -p /usr/share/live/build/bootloaders/isolinux
          sudo cp -af /usr/lib/ISOLINUX/. /usr/share/live/build/bootloaders/isolinux/ 2>/dev/null
          sudo cp -af /usr/lib/syslinux/modules/bios/. /usr/share/live/build/bootloaders/isolinux/ 2>/dev/null
          [ -f /usr/lib/ISOLINUX/vesamenu.c32 ] || \
            sudo cp -af /usr/lib/syslinux/modules/bios/vesamenu.c32 /usr/lib/ISOLINUX/ 2>/dev/null
          echo "=== bootloaders/isolinux contents ==="
          ls -l /usr/share/live/build/bootloaders/isolinux/ 2>&1 | sudo tee -a install.log
          # Also make sure the grub bootloader dir exists (grub stage runs too).
          sudo mkdir -p /usr/share/live/build/bootloaders/grub

      - name: Build ISO
        run: sudo ./build.sh

      - name: Upload install log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-install-log
          path: install.log
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-build-log
          path: build.log
          retention-days: 7

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-iso
          path: "*.iso"
          retention-days: 30
