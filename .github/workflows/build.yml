name: Build KnucklsOS ISO

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'README'
      - 'previews/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          set -x
          sudo apt-get update 2>&1 | tee -a install.log
          sudo apt-get install -y live-build debootstrap cpio squashfs-tools xorriso apt-utils isolinux syslinux 2>&1 | tee -a install.log
          # WORKAROUND: Ubuntu's live-build fork (3.0~a57) fetches the kernel
          # version list from dists/<suite>/Contents-amd64.gz, but Debian moved
          # that file to dists/<suite>/main/Contents-amd64.gz (404 -> build fails).
          # Patch the correct variable patterns in the installed script(s).
          echo "=== locating lb_chroot_linux-image ==="
          sudo find / -name 'lb_chroot_linux-image' 2>/dev/null | sudo tee -a install.log
          sudo find / -name 'lb_chroot_linux-image' | while read -r f; do
            sudo sed -i \
              -e 's#dists/${LB_PARENT_DISTRIBUTION}/Contents-#dists/${LB_PARENT_DISTRIBUTION}/main/Contents-#g' \
              -e 's#dists/${LB_DISTRIBUTION}/Contents-#dists/${LB_DISTRIBUTION}/main/Contents-#g' \
              "$f"
            echo "patched $f"
          done
          echo "=== verify patch ==="
          sudo find / -name 'lb_chroot_linux-image' -exec grep -n 'Contents' {} \; 2>/dev/null | sudo tee -a install.log
          # WORKAROUND 2 (root cause): live-build's lb_binary_syslinux copies
          # boot files from ${LIVE_BUILD}/bootloaders/isolinux. LIVE_BUILD is
          # /usr/lib/live on this fork (scripts live there), NOT
          # /usr/share/live/build. That dir lacks isolinux.bin/vesamenu.c32,
          # so chroot/root/isolinux is incomplete and the later cp of
          # /root/isolinux/isolinux.bin fails. Populate BOTH possible locations
          # with the real syslinux binaries (GitHub runs with set -e, so we
          # must not let any single cp abort the step -> set +e).
          set +e
          for base in /usr/lib/live /usr/share/live/build; do
            sudo mkdir -p "$base/bootloaders/isolinux"
            for f in isolinux.bin vesamenu.c32 ldlinux.c32 libcom32.c32 libutil.c32; do
              for d in /usr/lib/ISOLINUX /usr/lib/syslinux/modules/bios /usr/share/syslinux /usr/lib/syslinux; do
                if [ -f "$d/$f" ]; then
                  sudo cp -f "$d/$f" "$base/bootloaders/isolinux/" 2>/dev/null
                  break
                fi
              done
            done
            sudo cp -rf /usr/lib/syslinux/modules/bios/. "$base/bootloaders/isolinux/" 2>/dev/null
          done
          sudo mkdir -p /usr/lib/live/bootloaders/grub /usr/share/live/build/bootloaders/grub
          echo "=== /usr/lib/live/bootloaders/isolinux contents ==="
          ls -l /usr/lib/live/bootloaders/isolinux/ 2>&1 | sudo tee -a install.log

      - name: Build ISO
        run: sudo ./build.sh

      - name: Upload install log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-install-log
          path: install.log
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-build-log
          path: build.log
          retention-days: 7

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knucklsos-iso
          path: "*.iso"
          retention-days: 30
